          "@type": "Question",
          "name": "What is Chumlab UI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chumlab UI is an open-source React component library with 31 production-grade, accessible, and fully themeable UI components. Built with TypeScript and Tailwind CSS v4, it provides keyboard navigation, WCAG 2.1 AA compliance, unstyled mode, and zero vendor lock-in."
          }
        },
        {
          "@type": "Question",
          "name": "How do I install Chumlab UI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Install via npm: npm install @chumlab/ui. Chumlab UI requires React 18+ and React DOM 18+ as peer dependencies. Then import components like: import { Button, Input } from '@chumlab/ui'."
          }
        },
        {
          "@type": "Question",
          "name": "Is Chumlab UI accessible?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every component ships with ARIA roles and states (WAI-ARIA 1.2), full keyboard navigation, focus management and trapping for modals and drawers, screen reader announcements via aria-live regions, and prefers-reduced-motion support. All components target WCAG 2.1 AA compliance."
          }
        },
        {
          "@type": "Question",
          "name": "How is Chumlab UI different from other React component libraries?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chumlab UI combines production-ready defaults with full customizability. Unlike headless libraries, it ships with polished styles. Unlike opinionated libraries, every component supports an unstyled mode, surgical CSS class overrides via the classes prop, and data-* attributes for CSS targeting. It uses zero runtime CSS-in-JS and is built on Tailwind CSS v4 for optimal performance."
          }
        },
        {
          "@type": "Question",
          "name": "What components does Chumlab UI include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chumlab UI includes 31 components: Button, Input, TextArea, Checkbox, Switch, RadioButton, Slider, DatePicker, TimePicker, OtpInput, InternationalPhoneInput, Dropdown, SearchableDropdown, MultiSelectDropdown, MultiSelectSearchableDropdown, CascadingDropdown, Modal, Drawer, Tooltip, Toast, Table, Accordion, Avatar, Breadcrumb, Pagination, TabPanel, Stepper, Toggle, Loader, CountryFlag, and ResizablePanel."
          }
        }
      ]
    }

      <h1>Chumlab UI — Production-Grade React Component Library</h1>
      <p>Chumlab UI is an open-source React component library with 31 accessible, themeable components built with TypeScript and Tailwind CSS v4.</p>
      <h2>What is Chumlab UI?</h2>
      <p>Chumlab UI provides production-ready UI components for React applications. Every component includes WCAG 2.1 AA accessibility, full keyboard navigation, CSS class overrides, and an unstyled mode for complete design freedom.</p>
      <h2>Components</h2>
      <p>Button, Input, TextArea, Checkbox, Switch, RadioButton, Slider, DatePicker, TimePicker, OtpInput, InternationalPhoneInput, Dropdown, SearchableDropdown, MultiSelectDropdown, MultiSelectSearchableDropdown, CascadingDropdown, Modal, Drawer, Tooltip, Toast, Table, Accordion, Avatar, Breadcrumb, Pagination, TabPanel, Stepper, Toggle, Loader, CountryFlag, ResizablePanel.</p>
      <h2>Installation</h2>
      <p>npm install @chumlab/ui — Requires React 18+ as a peer dependency.</p>
      <p>Visit <a href="https://github.com/chumlabhq/ui">Chumlab UI on GitHub</a> to get started.</p>
