    <!-- SEO: Primary Meta Tags -->

    <meta
      name="description"
      content="An open-source React component library built for real world usage — handling states, edge cases, and everything beyond the happy path. 30 accessible, themeable React components for Next.js. MIT licensed."
    />
    <meta
      name="keywords"
      content="react components, ui library, tailwind css, typescript, accessible components, design system, react 19, headless ui, unstyled components, component library"
    />
    <meta name="author" content="Chumlab" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://chumlab.com/" />

    <!-- SEO: Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chumlab" />
    <meta
      property="og:title"
      content="Chumlab. Components that ship at the speed of thought."

      content="The React component library for builders who care about craft."

      name="twitter:title"

      name="twitter:description"

    <!-- "GEO" in this project's SEO step means Generative Engine
         Optimization (LLM citation), not geographic targeting. Geographic
         meta tags (geo.region / geo.position / geo.placename / ICBM) are
         deliberately NOT included — Chumlab UI is an open-source library
         with no regional market. Generic non-geographic crawler hints
         remain. -->
    <meta name="language" content="English" />
    <meta name="distribution" content="global" />
    <meta name="rating" content="general" />
    <meta name="revisit-after" content="7 days" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050608" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Structured Data: FAQ (AI discoverability) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Chumlab UI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Chumlab UI is an open-source React component library with production-grade, accessible, and fully themeable UI components. Built with TypeScript and Tailwind CSS v4, it provides keyboard navigation, WCAG 2.1 AA compliance, unstyled mode, and zero vendor lock-in."
            }
          },
          {
            "@type": "Question",
            "name": "How do I install Chumlab UI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Install via npm: npm install @chumlab/ui. Chumlab UI requires React 18+ and React DOM 18+ as peer dependencies. Then import components like: import { Button, Input } from '@chumlab/ui'."
            }
          },
          {
            "@type": "Question",
            "name": "Is Chumlab UI accessible?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every component ships with ARIA roles and states (WAI-ARIA 1.2), full keyboard navigation, focus management and trapping for modals and drawers, screen reader announcements via aria-live regions, and prefers-reduced-motion support. All components target WCAG 2.1 AA compliance."
            }
          },
          {
            "@type": "Question",
            "name": "How is Chumlab UI different from other React component libraries?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Chumlab UI combines production-ready defaults with full customizability. Unlike headless libraries, it ships with polished styles. Unlike opinionated libraries, every component supports an unstyled mode, surgical CSS class overrides via the classes prop, and data-* attributes for CSS targeting. It uses zero runtime CSS-in-JS and is built on Tailwind CSS v4 for optimal performance."
            }
          },
          {
            "@type": "Question",
            "name": "What components does Chumlab UI include?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Chumlab UI includes a growing collection of components: Button, Input, TextArea, Checkbox, Switch, RadioButton, Slider, DatePicker, TimePicker, OtpInput, InternationalPhoneInput, Dropdown, SearchableDropdown, MultiSelectDropdown, MultiSelectSearchableDropdown, CascadingDropdown, Modal, Drawer, Tooltip, Toast, Table, Accordion, Avatar, Breadcrumb, Pagination, TabPanel, Stepper, Loader, CountryFlag, and ResizablePanel."
            }
          },
          {
            "@type": "Question",
            "name": "What is the Chumlab AI Playground?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Chumlab AI Playground is an in-product assistant that turns a plain-English prompt or an uploaded screenshot into production-ready React and Next.js code built with the Chumlab UI components you already ship with. It breaks the requirement into a task plan, generates typed, accessible JSX, and shows a live preview of the rendered component."
            }
          }
        ]
      }
    </script>

      <h2>What is Chumlab UI?</h2>
