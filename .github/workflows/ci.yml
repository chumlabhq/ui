# The fast gates: everything that can run on every push without anyone waiting.
#
# The slow ones — the five-engine matrix, the visual baselines, the consumer
# matrix and the packaging gate — are in release-gates.yml. The split is by
# cost, not by importance: `verify:consumers` alone has taken anywhere from 60s
# to 2068s for identical code, because its wall time is npm's, not ours.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The npm scripts set this themselves; setting it job-wide means
  # `playwright install` puts the browsers where the scripts will look for them,
  # which is also the path the cache below keys on.
  PLAYWRIGHT_BROWSERS_PATH: "0"

jobs:
  static:
    name: typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `engines` allows >= 18. Only the current LTS is exercised here, and
          # README says so rather than implying every version is covered.
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs tsc --build over the solution AND tsconfig.node16.json, each
      # preceded by a planted failure it has to catch first.
      - run: npm run typecheck
      - run: npm run lint

  unit:
    name: unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The snippets project mounts every generated snippet against the built
      # package: vitest.config.ts aliases each `@chumlab/ui/*` export to its
      # file in dist/, and mount.snippets.tsx:124 fails when dist/ is absent.
      # dist/ is gitignored, so a checkout has none. The snippets themselves are
      # tracked, and nothing in test:run reads the site build, so this is the
      # only build it needs. postbuild:lib's bundle and packaging assertions
      # run with it.
      - run: npm run build:lib
      - run: npm run test:run

  e2e:
    name: e2e (chromium)
    # Pinned, not ubuntu-latest: that label moved to Ubuntu 26.04 from
    # 2026-10-19, and Playwright 1.58 (the lockfile's) has no Chromium build or
    # system dependencies for it, so `playwright install` failed before a test
    # ran ("Playwright does not support chromium on ubuntu26.04-x64"). Move
    # this when a Playwright upgrade that supports 26.04 lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Four shards, because one job never fit: the chromium project is 72.8 min
    # of tests on one worker, and its heaviest specs (icon-bounds,
    # surface-fit, rtl-surfaces, focus-not-obscured, pointer-affordance, 5 to 8
    # min each) are single tests, so the split is by test and not even. Summed
    # per shard from one-worker timings: 26.2, 15.2, 24.8 and 6.6 min. Three
    # shards were tried first: the longest took 20.3 min at two workers
    # (playwright.config.ts), too close to this timeout once a slower runner and
    # setup are added.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Restored after `npm ci`, not before: the browsers live inside
      # node_modules under PLAYWRIGHT_BROWSERS_PATH=0, and `npm ci` deletes that
      # directory. Keyed on the lockfile because that is what pins the
      # Playwright version.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Even on a cache hit the OS-level libraries are not in the cache.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
