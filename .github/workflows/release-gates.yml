# The slow gates. Not on every push — these are minutes to tens of minutes each.
#
# THERE IS NO PUBLISH STEP HERE, DELIBERATELY. Provenance publishing needs a
# workflow with `id-token: write` and an `npm publish --provenance`; neither is
# below, and nothing in this file can push to a registry. Adding that is a
# separate, reviewed change.
name: Release gates

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_BROWSERS_PATH: "0"

jobs:
  # ── the browser matrix, one project per job ─────────────────────────────
  #
  # One macOS job holding all seven projects ran into GitHub's 1h30 limit and was
  # cancelled with no verdict (run 41801071572). The durations below are the
  # local ones from runs B to E on an 8-core Mac; the runner has 3 cores, so each
  # shard count leaves room for a slower machine, and each job's timeout is 45.
  # Nothing here is expected past 40 minutes.
  #
  # The last job, `reconcile`, sums what every shard says it collected and fails
  # if a shard is missing or the sum falls short of `playwright test --list`.
  #
  # macOS 26 by name: `e2e/visual.spec.ts-snapshots` holds 920 baselines named
  # `-visual-darwin.png`, recorded on macOS 26 (local 26.6.1). The name holds the
  # platform and no version, and the files carry no metadata, so the first run
  # here is what says whether this runner's rasteriser matches: `visual` reds on
  # its own and no other job waits for it.

  e2e-chromium:
    name: e2e chromium (${{ matrix.shard }}/4)
    # 72.8 min on one worker (2026-10-31), 2 workers here, the same four shards as ci.yml: 26.2, 15.2, 24.8, 6.6 min of tests, 25 min at worst on CI.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test --project="chromium" --shard=${{ matrix.shard }}/4
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-chromium-${{ matrix.shard }}
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-chromium-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-firefox:
    name: e2e firefox (${{ matrix.shard }}/4)
    # 59 min to 1.1 h on 2 workers (run D, three full runs): 15 to 25 min a shard.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install firefox
      - run: npx playwright test --project="firefox" --shard=${{ matrix.shard }}/4
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-firefox-${{ matrix.shard }}
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-firefox-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-webkit:
    name: e2e webkit (${{ matrix.shard }}/4)
    # 1.2 h on 1 worker (run B): 18 to 30 min a shard.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - run: npx playwright test --project="webkit" --shard=${{ matrix.shard }}/4
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-webkit-${{ matrix.shard }}
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-webkit-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-mobile-chrome:
    name: e2e Mobile Chrome (${{ matrix.shard }}/4)
    # The chromium tests in a phone viewport, so chromium's estimate: 25 min at worst.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test --project="Mobile Chrome" --shard=${{ matrix.shard }}/4
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-mobile-chrome-${{ matrix.shard }}
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-mobile-chrome-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-mobile-safari:
    name: e2e Mobile Safari (${{ matrix.shard }}/4)
    # 1.2 h on 1 worker (4400 s, run B): 18 to 30 min a shard.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - run: npx playwright test --project="Mobile Safari" --shard=${{ matrix.shard }}/4
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-mobile-safari-${{ matrix.shard }}
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-mobile-safari-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-visual:
    name: visual baselines
    # 550 tests, 5.0 min on 4 local workers (run C): 15 min on 2 here.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test --project="visual"
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-visual-1
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-visual-1
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-a11y-full:
    name: a11y-full (${{ matrix.shard }}/2)
    # 22 tests, 22.2 min on 2 workers (run C), three of them most of it: 20 min a shard here.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test --project="a11y-full" --shard=${{ matrix.shard }}/2
        env:
          E2E_RECONCILE_JSON: reconcile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconcile-e2e-a11y-full-${{ matrix.shard }}
          path: reconcile.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-e2e-a11y-full-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  reconcile:
    name: e2e matrix reconcile (every shard, every test)
    needs: [e2e-chromium, e2e-firefox, e2e-webkit, e2e-mobile-chrome, e2e-mobile-safari, e2e-visual, e2e-a11y-full]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: reconcile-*
          path: shards
      - run: node scripts/reconcile-shards.mjs --self-check
      - run: node scripts/reconcile-shards.mjs shards

  # ── the scroll lock against a classic scrollbar ─────────────────────────
  #
  # Only a classic scrollbar has a side for the lock to pad, and no other job
  # has one: macOS draws overlay bars, and the Linux jobs run Chromium, whose
  # bar is on the right in both directions. Firefox on Windows draws a classic
  # bar, so this is where the padded side is measured rather than assumed. The
  # floor fails the job if that stops being true: a gutter of 0 passes the test
  # with nothing measured.
  scroll-lock-windows:
    name: scroll lock (Windows, Firefox)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install firefox

      # What each switch does, printed before the test that needs the result:
      # run 41801071572 measured a gutter of 0 here in both directions, and
      # nothing said why. No pref of Playwright's forces overlay bars (its
      # playwright.cfg has no `overlay` or `scrollbar` line), so what draws them
      # is Windows' own setting and Firefox's reading of it.
      - run: node scripts/measure-scrollbar-gutter.mjs none
      - run: node scripts/measure-scrollbar-gutter.mjs prefs-only
      - name: Windows "Always show scrollbars"
        shell: pwsh
        run: Set-ItemProperty -Path 'HKCU:\Control Panel\Accessibility' -Name DynamicScrollbars -Value 0
      - run: node scripts/measure-scrollbar-gutter.mjs registry-only
      - run: node scripts/measure-scrollbar-gutter.mjs both

      - run: npx playwright test --project=firefox e2e/open-close.spec.ts -g "scroll lock never moves the page"
        env:
          SCROLL_LOCK_GUTTER_FLOOR: "1"
          E2E_FIREFOX_CLASSIC_SCROLLBARS: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: scroll-lock-windows-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # ── the package, read from outside the repo ─────────────────────────────
  consumers:
    name: consumer matrix
    # Pinned for the reason ci.yml's e2e job is: verify:consumers launches
    # Chromium, and ubuntu-latest is Ubuntu 26.04, which Playwright 1.58 has
    # no Chromium build for.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A second, wider npm cache on top of setup-node's.
      #
      # setup-node keys ~/.npm on this repo's lockfile, which says nothing about
      # what the six throwaway consumer apps install — Next, React Router, two
      # React majors and their toolchains, none of which appear in it. Without a
      # warm cache those installs dominate: identical code has run in 60s and in
      # 2068s, and next-app alone went from 13s to 1137s between two runs. The
      # restore-keys fallback is what makes it survive a template edit.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-consumers-${{ runner.os }}-${{ hashFiles('scripts/consumers/*/package.json') }}
          restore-keys: |
            npm-consumers-${{ runner.os }}-

      - run: npm ci

      # The matrix renders and hydrates every consumer app in Chromium
      # (verify-consumer-matrix.mjs and verify-consumer-runtime.mjs call
      # `chromium.launch()`), and nothing else here installs it. The same
      # steps as ci.yml's e2e job, for the same reasons.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Packs the library (which runs prepack, so this builds it too), installs
      # the tarball into nine framework apps, renders all thirty components in
      # the five general ones and hydrates each on its own route. It writes
      # docs/adr/003-ssr-hydration.json from what it measured.
      - run: npm run verify:consumers
      # Which `ai/component-index.json` then has to agree with. Runs here rather
      # than in the unit tier because the record it reads is only fresh
      # immediately after the matrix above.
      - run: npm run verify:ssr-record
      - run: npm run verify:ssr-record:self-check

  # ── the tarball itself ──────────────────────────────────────────────────
  #
  # `postbuild:lib` already runs this on every library build, so the consumers
  # job above covers it. It is a separate job so that a packaging failure is
  # legible on its own rather than being reported as "the consumer matrix
  # failed", and so the self-check runs — which the build-time invocation does
  # not, because planting defects on every build is not worth the minutes.
  packaging:
    name: packaging gate (publint, attw, shipped links)
    # Pinned: every job names its image (scripts/assert-ci-runners.mjs).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run verify:packaging:self-check
